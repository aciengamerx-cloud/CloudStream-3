plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

def tmpFilePath = System.getProperty("user.home") + "/work/_temp/keystore/"
def allFilesFromDir = new File(tmpFilePath).listFiles()
def prerelaseStoreFile = null
if (allFilesFromDir != null) {
    prerelaseStoreFile = allFilesFromDir.first()
}


android {
    namespace 'com.lagradost.cloudstream3'

    testOptions {
        unitTests.returnDefaultValues = true
    }
    signingConfigs {
        prerelease {
            if (prerelaseStoreFile != null) {
                storeFile = file(prerelaseStoreFile)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }
    compileSdk 34

    defaultConfig {
        applicationId "com.aistudio.cloudstream.kxmpzq"
        minSdkVersion 21
        targetSdkVersion 34

        versionCode 49
        versionName "3.0.1"

        resValue "string", "app_version",
                "${defaultConfig.versionName}${versionNameSuffix ?: ""}"

        buildConfigField("String", "BUILDDATE", "new java.text.SimpleDateFormat(\"yyyy-MM-dd HH:mm\").format(new java.util.Date(" + System.currentTimeMillis() + "L));")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        prerelease {
            applicationIdSuffix ".prerelease"
            buildConfigField("boolean", "BETA", "true")
            signingConfig signingConfigs.prerelease
            versionNameSuffix '-PRE'
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs = ['-Xjvm-default=all-compatibility']
    }
}

repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.google.android.mediahome:video:1.0.0'
    implementation 'androidx.test.ext:junit-ktx:1.1.3'
    testImplementation 'org.json:json:20180813'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.15.2"

    implementation "androidx.preference:preference-ktx:1.2.1"

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'

    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Exoplayer
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:extension-cast:2.19.1'
    implementation "com.google.android.exoplayer:extension-mediasession:2.19.1"
    implementation 'com.google.android.exoplayer:extension-okhttp:2.19.1'

    // Bug reports
    implementation "ch.acra:acra-core:5.8.4"
    implementation "ch.acra:acra-toast:5.8.4"

    compileOnly "com.google.auto.service:auto-service-annotations:1.1.1"
    annotationProcessor "com.google.auto.service:auto-service:1.1.1"
    kapt "com.google.auto.service:auto-service:1.1.1"

    // subtitle color picker
    implementation 'com.jaredrummler:colorpicker:1.1.0'

    // run JS
    implementation 'org.mozilla:rhino:1.7.14'

    // Downloading
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Networking
    implementation 'com.github.Blatzar:NiceHttp:0.4.11'

    // Util to skip the URI file issue
    implementation "com.github.tachiyomiorg:unifile:17bec43"

    // API
    implementation "com.uwetrottmann.tmdb2:tmdb-java:2.9.0"

    implementation 'com.github.discord:OverlappingPanels:0.1.3'

    // for shimmer when loading
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    implementation "androidx.tvprovider:tvprovider:1.0.0"

    // used for subtitle decoding
    implementation 'com.github.albfernandez:juniversalchardet:2.4.0'

    // newpipe yt
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.22.7'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}